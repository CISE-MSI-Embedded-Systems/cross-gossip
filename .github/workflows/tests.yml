name: Run Tests

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - name: Build and run tests
        run: |
          mkdir -p build
          cd build
          cmake ..
          make
          ./tests/tests
